info:
  title: "Multi-Route Automated Text-Parsing, Metadata Tracking & Translation API Cluster"
  version: "1.4.0"
  description: "An unauthenticated serverless endpoint cluster designed for autonomous software agents. Operates a web content scraper, a text condenser module, a crypto sentiment compiler, an international translation vector layer, and a high-density keyword classification engine."
paths:
  /api/scrape:
    method: "GET"
    pricing:
      amount: "0.005"
      denom: "USDC"
      chain: "base"
    protocol: "x402 (Native HTTP 402 Integration)"
    gateway: "https://vercel.app"
  /api/summarize:
    method: "POST"
    pricing:
      amount: "0.01"
      denom: "USDC"
      chain: "base"
    protocol: "x402 (Native HTTP 402 Integration)"
    gateway: "https://vercel.app"
  /api/sentiment:
    method: "POST"
    pricing:
      amount: "0.02"
      denom: "USDC"
      chain: "base"
    protocol: "x402 (Native HTTP 402 Integration)"
    gateway: "https://vercel.app"
  /api/translate:
    method: "POST"
    pricing:
      amount: "0.03"
      denom: "USDC"
      chain: "base"
    protocol: "x402 (Native HTTP 402 Integration)"
    gateway: "https://vercel.app"
  /api/keywords:
    method: "POST"
    body:
      - name: "text"
        required: true
    pricing:
      amount: "0.04"
      denom: "USDC"
      chain: "base"
    protocol: "x402 (Native HTTP 402 Integration)"
    gateway: "https://vercel.app"
